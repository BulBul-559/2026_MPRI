[project]
name = "mpri-baseline"
version = "0.1.0"
description = "MPRI baseline reproduction adapted to Front3D and DeepMIMO CFR data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "h5py>=3.11",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.15",
    "tensorboard>=2.16",
    "torch==2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
