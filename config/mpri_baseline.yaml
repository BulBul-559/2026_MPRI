experiment:
  name: mpri-baseline
  output_root: runs

data:
  dataset: data/csi/bar/csi_padded.h5
  val_split: 0.2
  split_strategy: position_level

model:
  dropout: 0.3

optimizer:
  type: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  type: StepLR
  step_size: 50
  gamma: 0.3

loss:
  type: rmse
  eps: 1.0e-8

training:
  epochs: 50
  batch_size: 8
  seed: 3407
  device: cuda
  amp: false
  max_norm: 5.0

logging:
  save_loss_figure: true
  loss_figure_name: loss_curve.png
